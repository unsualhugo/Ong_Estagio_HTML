<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cadastre-se na ONG Valentine Estágios e encontre oportunidades de estágio e voluntariado.">
  <title>Valentine Estágios — Cadastro</title>
</head>
<body>
  <header class="site-header">
    <picture>
      <img src="imagens/valentine-logo.png" alt="Logo ONG Valentine" width="140" height="100">
    </picture>

    <nav aria-label="Navegação principal">
      <ul class="nav-list">
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="cadastro-title">
      <section class="container">
        <h1 id="cadastro-title">Cadastro de Estudantes</h1>
        <p>Preencha o formulário abaixo para se cadastrar em nossos programas de estágio e projetos sociais. Todos os campos são obrigatórios.</p>
        <img src="imagens/se_cadastrando.png" alt="Voluntários em um projeto social" width="500" height="300">

        <form action="#" method="post" aria-labelledby="cadastro-title">
          <fieldset>
            <legend>Informações Pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" placeholder="(11) 98765-4321">

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
          </fieldset>

          <fieldset>
            <legend>Endereço</legend>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e complemento">

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required maxlength="2" placeholder="SP">
          </fieldset>

          <button type="submit">Enviar Cadastro</button>
        </form>
      </section>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <section class="container">
      <p>&copy; <span id="year"></span> ONG Estágios — Todos os direitos reservados.</p>
      <ul class="social">
        <li><a href="https://www.instagram.com/valentine_estagios" aria-label="Instagram">Instagram</a></li>
      </ul>
    </section>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Máscaras simples
    document.getElementById('cpf').addEventListener('input', e => {
      e.target.value = e.target.value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    });

    document.getElementById('telefone').addEventListener('input', e => {
      e.target.value = e.target.value
        .replace(/\D/g, '')
        .replace(/^(\d{2})(\d)/, '($1) $2')
        .replace(/(\d{5})(\d{4})$/, '$1-$2');
    });

    document.getElementById('cep').addEventListener('input', e => {
      e.target.value = e.target.value
        .replace(/\D/g, '')
        .replace(/(\d{5})(\d{3})$/, '$1-$2');
    });
  </script>
</body>
</html>
