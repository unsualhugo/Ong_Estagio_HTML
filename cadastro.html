<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Valentine Estágios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <section class="container">
      <a href="index.html" class="logo">
        <picture>
          <img src="imagens/valentine-logo.png" alt="Logo ONG Valentine">
        </picture>
      </a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="cadastro.html" class="active">Cadastro</a></li>
        </ul>
      </nav>
    </section>
  </header>

  <main class="container">
    <h2 id="cadastro-title">Cadastro de Participantes</h2>
    <p>Preencha seus dados abaixo para participar de nossos projetos e receber novidades sobre capacitações e eventos.</p>

    <section class="cadastro-section">
      <div class="cadastro-imagem">
        <img src="imagens/se_cadastrando.png" alt="Ilustração de cadastro">
      </div>

      <form id="formCadastroGeral" class="cadastro-form">
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required pattern="\d{2}\s?\d{5}-?\d{4}" placeholder="(xx) xxxxx-xxxx">

        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" name="data" required>

        <label for="projeto">Projeto de interesse:</label>
        <select id="projeto" name="projeto" required>
          <option value="">Selecione</option>
          <option value="Projeto Jovem Dev">Projeto Jovem Dev</option>
          <option value="Projeto Raízes do Amanhã">Projeto Raízes do Amanhã</option>
          <option value="Corações em Ação">Corações em Ação</option>
        </select>

        <label for="mensagem">Fale um pouco sobre você:</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Conte-nos o que te motiva..."></textarea>

        <div class="form-actions">
          <button type="submit">Enviar Cadastro</button>
          <button type="reset">Limpar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ONG Valentine Estágios — Todos os direitos reservados.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
